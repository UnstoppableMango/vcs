name: CI

on:
  push:
    branches: [main]
  pull_request:

# One group per PR. Restacking force-pushes every branch in a stack at once, so
# superseded runs for the same PR are cancelled.
# Pushes to main key on the SHA, giving each commit its own group: merging a
# stack lands several commits at once and every one of them needs a full check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: unmango/actions/setup-nix@e8bbcbd12a2c521c5cb36957c00a7a8f4fe2e766 # v2.0.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # `unmango` is where the github and gitlab provider plugins come from.
      # Without it every run rebuilds both from source, which is a long Go
      # build each.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: unmango

      - run: nix flake check

  # Previews only. The Pulumi Kubernetes Operator Stack `vcs` in
  # UnstoppableMango/the-cluster (apps/vcs/stack.yml) applies prod, with a
  # refresh, for each commit on main. Previews are read-only and take no part
  # in that, so the workflow-level group (one per PR, superseded runs
  # cancelled) is all the concurrency control they need.
  pulumi:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: unmango/actions/setup-nix@e8bbcbd12a2c521c5cb36957c00a7a8f4fe2e766 # v2.0.0
        with:
          github_access_token: ${{ github.token }}

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: unmango

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read secrets from Key Vault
        uses: azure/cli@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        with:
          inlineScript: |
            get() {
              az keyvault secret show \
                --vault-name unstoppablemango-pulumi \
                --name "$1" \
                --query value -o tsv
            }

            # `name=value` would let a secret containing a newline inject
            # further entries into the env file. The heredoc form is bounded by
            # a per-value random delimiter, so the value is taken verbatim.
            emit() {
              local delimiter
              delimiter="ghenv_$(openssl rand -hex 16)"
              printf '%s<<%s\n%s\n%s\n' "$1" "$delimiter" "$2" "$delimiter" \
                >> "$GITHUB_ENV"
            }

            passphrase=$(get vcs-pulumi-passphrase)
            access_key_id=$(get vcs-state-bucket-key-id)
            secret_access_key=$(get vcs-state-bucket-key)

            echo "::add-mask::$passphrase"
            echo "::add-mask::$access_key_id"
            echo "::add-mask::$secret_access_key"

            emit PULUMI_CONFIG_PASSPHRASE "$passphrase"
            emit AWS_ACCESS_KEY_ID "$access_key_id"
            emit AWS_SECRET_ACCESS_KEY "$secret_access_key"

      - run: nix develop -c bun install --frozen-lockfile

      # Every plugin is on PATH from nix, so a version the SDKs no longer ask
      # for would be used silently. Fail before touching the backend.
      - run: nix develop -c check-pulumi-plugins

      - run: nix develop -c pulumi stack select prod

      - run: nix develop -c pulumi preview --diff
